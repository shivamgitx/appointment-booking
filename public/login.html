<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — BookEase</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/api.js" defer></script>
  <script src="/js/login.js" defer></script>
</head>
<body>
  <header class="nav" id="nav"></header>

  <main class="container narrow">
    <section class="card auth-card">
      <h1>Welcome back</h1>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
          <p class="field-error" id="email-error" hidden></p>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
          <p class="field-error" id="password-error" hidden></p>
        </div>

        <p class="form-error" id="form-error" hidden></p>

        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Log in</button>
      </form>
      <p class="switch-line">New here? <a href="/register.html">Create an account</a></p>
    </section>
  </main>
</body>
</html>
