<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — BookEase</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/api.js" defer></script>
  <script src="/js/register.js" defer></script>
</head>
<body>
  <header class="nav" id="nav"></header>

  <main class="container narrow">
    <section class="card auth-card">
      <h1>Create your account</h1>
      <form id="register-form" novalidate>
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" autocomplete="name" required minlength="2" maxlength="100">
          <p class="field-error" id="name-error" hidden></p>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
          <p class="field-error" id="email-error" hidden></p>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
          <p class="hint">At least 8 characters.</p>
          <p class="field-error" id="password-error" hidden></p>
        </div>
        <div class="field">
          <label for="confirm">Confirm password</label>
          <input type="password" id="confirm" name="confirm" autocomplete="new-password" required>
          <p class="field-error" id="confirm-error" hidden></p>
        </div>

        <p class="form-error" id="form-error" hidden></p>

        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Register</button>
      </form>
      <p class="switch-line">Already have an account? <a href="/login.html">Log in</a></p>
    </section>
  </main>
</body>
</html>
